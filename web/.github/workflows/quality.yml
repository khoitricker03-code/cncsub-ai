name: Quality
on:
  push:
    branches: [main, feature/subtitle-editor]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-placeholder-secret
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
