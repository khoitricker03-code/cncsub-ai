services:
  postgres:
    image: postgres:16-alpine
    profiles: ["infrastructure"]
    environment:
      POSTGRES_USER: cncsub
      POSTGRES_PASSWORD: cncsub
      POSTGRES_DB: cncsub
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    profiles: ["infrastructure"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  redis-data:
